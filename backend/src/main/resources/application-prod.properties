# ===== PRODUCTION PROFILE (Render) =====
# PostgreSQL - env vars injected by render.yaml
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true

# Server
server.port=8080
app.base-url=${APP_BASE_URL:https://pulsenet-backend.onrender.com}

# Demo
demo.ambulance.simulation.enabled=true
demo.ambulance.simulation.radius-km=5.0

# Connection Pool (sized for free tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=pulsenethealth@gmail.com
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.from=pulsenethealth@gmail.com

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# VAPI
vapi.private.key=${VAPI_PRIVATE_KEY:}
vapi.public.key=${VAPI_PUBLIC_KEY:}

# Gemini AI
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
gemini.max.tokens=2000
gemini.temperature=0.7
gemini.timeout.connect=5000
gemini.timeout.read=15000

# Production Mode
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.jpa.defer-datasource-initialization=false
app.data-seeding.enabled=true
app.ml-initialization.enabled=false
app.schema-update.enabled=false

# Python AI Service
ai.python.base-url=${AI_PYTHON_BASE_URL:https://pulsenet-ml.onrender.com}
ai.python.enabled=true
ai.python.timeout=10000

# Google Cloud
google.cloud.project.id=pulsenet-490207
google.cloud.credentials.path=classpath:gcp-service-account.json

# Cloudflare R2
cloudflare.r2.account.id=c1c85ce6abba92d5390daca7c87a9835
cloudflare.r2.access.key.id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
cloudflare.r2.secret.access.key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}
cloudflare.r2.bucket.name=pulsenet
cloudflare.r2.endpoint=https://c1c85ce6abba92d5390daca7c87a9835.r2.cloudflarestorage.com
cloudflare.r2.region=auto

# File Upload
file.upload.dir=uploads/ai-health
file.max.size=10MB
file.allowed.types=image/jpeg,image/png,image/jpg,application/dicom

# Vertex AI
vertex.ai.location=us-central1
vertex.ai.model.medical=medlm-medium
vertex.ai.model.vision=imagetext@001

# Exercise AI
exercise.ai.timeout=10000
exercise.ai.max.retries=3
exercise.ai.fallback.enabled=true